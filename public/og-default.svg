  </text>

  <!-- Terracotta rule -->
  <rect x="88" y="392" width="84" height="4" rx="2" fill="#C86D51"/>

  <!-- Zero-em-dash editorial subtitle -->
  <text x="88" y="446" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="27" fill="#5A6065">
