  <!-- Subtle inner architectural frame -->
  <rect x="44" y="40" width="1116" height="550" stroke="#E6E1D6" stroke-width="2"/>

  <!-- Top Masthead Seal (F. Monogram + Lockup) -->
  <g transform="translate(88, 86)">
    <rect x="0" y="0" width="64" height="64" rx="15" fill="#1E3F2A"/>
    <rect x="2" y="2" width="60" height="60" rx="13" stroke="#FBF9F5" stroke-opacity="0.18" stroke-width="1.2"/>
    <path
      d="M17.5 15.5H42L42.7 23.5H40.3C39.6 19.6 37.9 18.3 33.7 18.3H27.3V29.2H32.9C36 29.2 37.3 28.1 37.8 25.2H40.1V35.8H37.8C37.3 32.8 36 31.8 32.9 31.8H27.3V42.2C27.3 45.1 28.6 46.1 31.9 46.3V48.5H17.5V46.3C20.6 46.1 21.7 45.1 21.7 42.2V21.6C21.7 18.7 20.6 17.9 17.5 17.7V15.5Z"
